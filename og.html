<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Maskatech Labs — Open Graph card</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/fonts/space-grotesk.css">
  <link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
  <style>
    /* Static 1200×630 card. No animation. Screenshotted to /assets/img/og-image.png. */
    :root {
      --bg: #050608; --fg: #eef1f5; --fg-2: #aab3bf; --fg-3: #7f8996; --accent: #2ae8d4;
      --line: rgba(255, 255, 255, 0.08);
      --font-display: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
    }
    html, body { margin: 0; background: var(--bg); }
    body { width: 1200px; height: 630px; overflow: hidden; color: var(--fg); font-family: var(--font-display); -webkit-font-smoothing: antialiased; }
    .card {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background:
        radial-gradient(45% 70% at 78% 50%, rgba(42, 232, 212, 0.10), transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 64px 64px,
        var(--bg);
    }
    .card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 80% at 30% 50%, transparent 40%, rgba(5, 6, 8, 0.85) 100%); pointer-events: none; }
    .frame { position: absolute; inset: 28px; border: 1px solid var(--line); border-radius: 10px; }
    .corner { position: absolute; width: 22px; height: 22px; border: 1px solid var(--accent); }
    .corner.tl { top: 27px; left: 27px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
    .corner.tr { top: 27px; right: 27px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
    .corner.bl { bottom: 27px; left: 27px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
    .corner.br { bottom: 27px; right: 27px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
    .mesh { position: absolute; top: 26px; right: 20px; width: 578px; height: 578px; z-index: 1; }
    .copy { position: absolute; left: 88px; top: 92px; display: flex; flex-direction: column; gap: 22px; z-index: 2; width: 600px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 30px; height: 30px; }
    .brand-word { font-weight: 600; font-size: 20px; letter-spacing: 0.14em; }
    .brand-labs { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.24em; color: var(--accent); margin-left: 10px; vertical-align: 0.5em; }
    .eyebrow { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0; }
    h1 { margin: 0; font-size: 80px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 500; }
    h1 .accent { color: var(--accent); }
    .lede { margin: 0; font-size: 22px; line-height: 1.4; color: var(--fg-2); max-width: 470px; }
    .url { position: absolute; left: 88px; bottom: 50px; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); z-index: 2; }
    .hud { position: absolute; right: 60px; top: 56px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-2); z-index: 2; display: flex; align-items: center; gap: 10px; }
    .hud i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <img class="mesh" src="assets/img/arch-mesh.svg" width="578" height="578" alt="">
    <p class="hud"><i></i>Mesh // Dental arch</p>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 21V12a8 8 0 0 1 16 0v9" fill="none" stroke="#eef1f5" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M2 15.5h20" fill="none" stroke="#2ae8d4" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12" cy="15.5" r="1.5" fill="#2ae8d4"/>
        </svg>
        <span class="brand-word">MASKATECH<span class="brand-labs">LABS</span></span>
      </div>
      <p class="eyebrow">Digital dental laboratory</p>
      <h1>Scan in.<br>Appliance <span class="accent">out.</span></h1>
      <p class="lede">Night guards and clear retainers, digitally designed for the individual case.</p>
    </div>
    <p class="url">maskatech.com</p>
  </div>
</body>
</html>
