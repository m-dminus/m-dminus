<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Maskatech Labs — Open Graph card</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <style>
    /* 1200×630 card. Screenshot this page at exactly that size to produce assets/img/og-image.png. */
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0914; color: #f2f0fa; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: radial-gradient(520px 520px at 88% 10%, rgba(139,124,255,0.30), transparent 62%), radial-gradient(520px 520px at 0% 90%, rgba(255,179,92,0.12), transparent 60%), #0a0914; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px); background-size: 72px 72px; opacity: 0.5;
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 70% 50%, #000 10%, transparent 100%); mask-image: radial-gradient(ellipse 70% 70% at 70% 50%, #000 10%, transparent 100%); }
    .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
    .brand { display: flex; align-items: center; gap: 14px; font-family: "Syne", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
    .brand svg { width: 40px; height: 40px; }
    .brand .labs { margin-left: 8px; font-family: "Geist Mono", monospace; font-weight: 500; font-size: 13px; letter-spacing: 0.16em; color: #ffb35c; vertical-align: 0.2em; }
    .eyebrow { margin: 52px 0 18px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #ffb35c; }
    h1 { margin: 0; font-family: "Syne", sans-serif; font-weight: 800; font-size: 68px; line-height: 0.96; letter-spacing: -0.035em; white-space: nowrap; }
    h1 em { font-style: normal; background: linear-gradient(120deg, #ffcf8a 0%, #ffb35c 35%, #8b7cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.sub { margin: 26px 0 0; font-size: 23px; line-height: 1.4; color: #bdb9d6; max-width: 540px; }
    .spec { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 40px; font-family: "Geist Mono", monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b96b8; }
    .spec b { display: block; margin-top: 8px; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0; text-transform: none; color: #f2f0fa; }
    .art { position: absolute; right: 52px; top: 76px; width: 450px; height: 450px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); overflow: hidden; }
    .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 4%; }
    .url { position: absolute; right: 72px; bottom: 60px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b96b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 27V15a10 10 0 0 1 20 0v12" fill="none" stroke="#f2f0fa" stroke-width="2.2" stroke-linecap="round"/><path d="M3 21.5h26M4.6 17h22.8" fill="none" stroke="#9b96b8" stroke-width="1.6" stroke-linecap="round"/><path d="M8.2 12.5h15.6" fill="none" stroke="#ffb35c" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Maskatech<span class="labs">LABS</span></span>
      </div>
      <p class="eyebrow">Digital dental laboratory</p>
      <h1>Built from<br>the scan <em>up.</em></h1>
      <p class="sub">Night guards and clear retainers, digitally designed for the individual case and fabricated in-house.</p>
    </div>
    <div class="art"><img src="assets/img/appliance-layers.svg" alt=""></div>
    <div class="spec">
      <div>Intake<b>Intraoral scan</b></div>
      <div>Design<b>Digital, per case</b></div>
      <div>Fabrication<b>In-house, from the file</b></div>
    </div>
    <p class="url">maskatech.com</p>
  </div>
</body>
</html>
