# Publishes the site to AWS (S3 + CloudFront) with deploy/aws/deploy.sh. Run it from the Actions tab.
# One-time setup in the repository settings (see deploy/aws/README.md):
#   Secret  AWS_ROLE_ARN     — IAM role the workflow assumes through GitHub's OIDC provider
#   Variables (optional): AWS_REGION (default us-east-1), AWS_STACK_NAME (default maskatech-site),
#                         SITE_DOMAIN (default maskatech.com), HOSTED_ZONE_ID, CERT_ARN, INCLUDE_WWW
name: Deploy site to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy stack and upload the site
        env:
          STACK: ${{ vars.AWS_STACK_NAME || 'maskatech-site' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DOMAIN: ${{ vars.SITE_DOMAIN || 'maskatech.com' }}
          INCLUDE_WWW: ${{ vars.INCLUDE_WWW || 'true' }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERT_ARN: ${{ vars.CERT_ARN }}
        run: bash deploy/aws/deploy.sh
