# Deploys the static site at the repository root to GitHub Pages.
# Every push to main deploys. One-time setup: Settings → Pages → Source: "GitHub Actions" (see README.md).
# actions/configure-pages's own enablement:true option cannot do this for you with the default GITHUB_TOKEN — its
# "Create a GitHub Pages site" call needs Administration: write, which GITHUB_TOKEN cannot be granted via the
# permissions: key below — so it is deliberately not set here; without it the first run on a repository where
# Pages isn't enabled yet fails at "Configure Pages" instead of silently doing nothing useful.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Leave repository-only files out of the published site
        run: rm -rf README.md CONTENT-REVIEW.md og.html .gitignore .github deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
