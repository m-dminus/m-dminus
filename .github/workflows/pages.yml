# Deploys the static site at the repository root to GitHub Pages.
# Every push to main deploys. The workflow enables Pages itself on first run; if that step is refused,
# set Settings → Pages → Source: "GitHub Actions" once and re-run it.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Leave repository-only files out of the published site
        run: rm -rf README.md CONTENT-REVIEW.md og.html .gitignore .github deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on for the repository if it is not enabled yet
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
