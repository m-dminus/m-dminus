<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Maskatech Labs</title>
  <meta name="description" content="The page you requested does not exist. Return to Maskatech Labs.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0914">
  <meta name="color-scheme" content="dark">
  <!-- GitHub Pages serves this page for any missing URL, including nested ones such as /a/b/. No <base> element is
       used: it would make same-page anchors such as the skip link ("#main") resolve against the site root instead
       of this page. Instead every internal reference below is written out with the computed root prefix. -->
  <script>
    (function () {
      var repo = 'm-dminus';   // the only place this repository's name needs to change after a rename
      // Detected from the HOST, not the path: on the github.io preview host every URL genuinely lives under
      // "/<repo>/", but on the custom domain or the CloudFront deployment the site is served at the root, so a
      // missing URL that happens to start with "/m-dminus/" (an old preview link, a bot probing the old path)
      // must NOT be treated as living under that prefix there — that would send every asset and the "back to the
      // lab" links to another 404. The optional final "\." matches a hostname typed with its trailing dot
      // ("m-dminus.github.io."), which the browser keeps in location.hostname.
      var root = /(^|\.)github\.io\.?$/.test(location.hostname) ? '/' + repo + '/' : '/';
      document.write(
        '<link rel="icon" href="' + root + 'favicon.svg" type="image/svg+xml">'
        + '<link rel="stylesheet" href="' + root + 'assets/fonts/fonts.css">'
        + '<link rel="stylesheet" href="' + root + 'assets/css/style.css">');
      document.documentElement.classList.replace('no-js', 'js');
      document.documentElement.dataset.root = root;
    })();
  </script>
  <!-- Root-absolute paths: correct once the custom domain is attached (site root "/") and for the AWS/CloudFront
       deployment (also site root). During the interim GitHub Pages project preview at "/m-dminus/" a visitor who
       reaches ANY not-found page there (/m-dminus/nope as much as /m-dminus/a/b/, or /m-dminus/404.html itself) with
       JavaScript disabled gets neither these assets nor working home links: the brand, "Start a case", "Back to the
       lab" and footer "maskatech.com" links below point at the github.io host root, not at /m-dminus/. A static file
       cannot know that prefix without running code; the scripts on this page handle it whenever JavaScript runs. -->
  <noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/css/style.css">
  </noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav is-scrolled">
    <div class="wrap nav-inner">
      <a class="brand nav-home" href="/" aria-label="Maskatech Labs — home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M6 27V15a10 10 0 0 1 20 0v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path class="mark-layer" d="M3 21.5h26M4.6 17h22.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path class="mark-layer mark-layer--hot" d="M8.2 12.5h15.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-word">Maskatech<span class="brand-labs">Labs</span></span>
      </a>
      <a class="btn btn--primary btn--sm nav-home-contact" href="/#contact">Start a case</a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="err wrap" aria-labelledby="err-title">
      <div class="err-inner">
        <p class="tag tag--accent">Error — Not found</p>
        <p class="err-code" aria-hidden="true">4<b>0</b>4</p>
        <h1 class="err-title" id="err-title">No layer at this address.</h1>
        <p>The address may have been typed incorrectly, or the page has moved. Everything else is where it was.</p>
        <div class="err-actions">
          <a class="btn btn--primary nav-home" href="/">Back to the lab <span class="btn-arrow" aria-hidden="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
          <a class="btn btn--ghost" href="mailto:cases@maskatech.com">cases@maskatech.com</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer footer--min">
    <div class="wrap footer-bottom">
      <p class="tag">© 2026 Maskatech Labs</p>
      <a class="tag nav-home" href="/">maskatech.com</a>
    </div>
  </footer>

  <!-- Rewrite the root-absolute links above to the computed prefix (needed on the /m-dminus/ project preview;
       a no-op once the custom domain is attached, since root is then "/"). Runs after the links exist in the DOM. -->
  <script>
    (function () {
      var root = document.documentElement.dataset.root;
      if (!root || root === '/') return;
      Array.prototype.forEach.call(document.querySelectorAll('.nav-home'), function (a) { a.setAttribute('href', root); });
      var cta = document.querySelector('.nav-home-contact');
      if (cta) cta.setAttribute('href', root + '#contact');
    })();
  </script>
</body>
</html>
