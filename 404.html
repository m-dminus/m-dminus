<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Maskatech Labs</title>
  <meta name="description" content="The page you requested does not exist. Return to Maskatech Labs.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050608">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/space-grotesk.css">
  <link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav is-scrolled">
    <div class="container nav-inner">
      <a class="brand" href="./" aria-label="Maskatech Labs — home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 21V12a8 8 0 0 1 16 0v9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <path class="mark-scan" d="M2 15.5h20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle class="mark-scan" cx="12" cy="15.5" r="1.5" fill="currentColor"/>
        </svg>
        <span class="brand-word">MASKATECH<span class="brand-labs">LABS</span></span>
      </a>
      <a class="btn btn--primary btn--sm" href="./#contact">Start a case</a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="err container" aria-labelledby="err-title">
      <div class="err-inner">
        <p class="mono mono--accent">ERR // Not found</p>
        <p class="err-code" aria-hidden="true">4<b>0</b>4</p>
        <h1 class="err-title" id="err-title">No page at this coordinate.</h1>
        <p>The address may have been typed incorrectly, or the page has moved. Everything else is where it was.</p>
        <div class="err-actions">
          <a class="btn btn--primary" href="./">Back to the lab <span class="btn-arrow" aria-hidden="true">→</span></a>
          <a class="btn btn--ghost" href="mailto:cases@maskatech.com">cases@maskatech.com</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer footer--min">
    <div class="container footer-bottom">
      <p class="mono">© 2026 Maskatech Labs</p>
      <a class="mono" href="https://maskatech.com/">maskatech.com</a>
    </div>
  </footer>
</body>
</html>
