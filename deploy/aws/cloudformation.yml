AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Maskatech Labs static site: a private S3 bucket served by CloudFront over HTTPS with the site's own 404 page,
  and an optional custom domain (ACM certificate + Route 53 alias records). Deploy this stack in us-east-1 when
  you want the stack to create the certificate; CloudFront only accepts certificates from that region.

Parameters:
  DomainName:
    Type: String
    Default: maskatech.com
    Description: Apex domain for the site. Only used when HostedZoneId or CertificateArn is set.
  IncludeWww:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Also serve www.<DomainName> and redirect it to the apex domain.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone ID for DomainName. When set, the stack creates a DNS-validated ACM certificate (unless
      CertificateArn is given) and the A/AAAA alias records. Leave empty while DNS stays at GoDaddy.
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing ACM certificate in us-east-1 that covers DomainName (and www.<DomainName> if IncludeWww is
      true). Leave empty to let the stack create one (needs HostedZoneId) or to publish on the CloudFront domain only.

Conditions:
  HasZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  CreateCert: !And [!Condition HasZone, !Not [!Condition HasCert]]
  CustomDomain: !Or [!Condition HasZone, !Condition HasCert]
  WithWww: !Equals [!Ref IncludeWww, "true"]
  CustomDomainWithWww: !And [!Condition CustomDomain, !Condition WithWww]
  ZoneWithWww: !And [!Condition HasZone, !Condition WithWww]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: CloudFront access to the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCert
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - WithWww
        - [!Sub "www.${DomainName}"]
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - WithWww
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub "www.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: CustomDomainWithWww
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www.<domain> to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          if (host.startsWith('www.')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + host.slice(4) + request.uri } }
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Maskatech Labs site
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - CustomDomain
          - !If
            - WithWww
            - [!Ref DomainName, !Sub "www.${DomainName}"]
            - [!Ref DomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed policy "CachingOptimized"
          FunctionAssociations: !If
            - CustomDomainWithWww
            - - EventType: viewer-request
                FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN
            - !Ref AWS::NoValue
        CustomErrorResponses:
          # A missing object behind Origin Access Control comes back from S3 as 403; both map to the site's 404 page.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate: !If
          - CustomDomain
          - AcmCertificateArn: !If [HasCert, !Ref CertificateArn, !Ref Certificate]
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed hosted zone ID for alias records
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  WwwRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: ZoneWithWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: S3 bucket that holds the site files (upload target)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID (for cache invalidations)
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront domain name (always works, even before DNS is set up)
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Description: Where the site is served
    Value: !If [CustomDomain, !Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
